<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=390">
<title>Leseecke</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --grund:#ecebf4; --tinte:#2d2440; --tinte2:#544a6b; --senf:#e9b949; --senf-d:#c9971f;
  --petrol:#3a7671; --rose:#e08a9b; --blau:#5a78c8; --wand:#d9d5ee; --wand2:#cfcae8;
  --boden:#cfb08f; --boden2:#c2a07c; --karton:#d8a76c; --tablett:#f6f4fb;
}
*{box-sizing:border-box;margin:0;padding:0}
button{font-family:inherit;cursor:pointer}
html,body{width:390px;height:844px;background:var(--grund);font-family:"M PLUS Rounded 1c",system-ui,sans-serif;color:var(--tinte);overflow:hidden}
.frame{position:relative;width:390px;height:844px;display:flex;flex-direction:column}
.status{height:54px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:6px 30px 0 34px;font-weight:700;font-size:16px}
.status .ic{display:flex;gap:6px;align-items:center}
/* Kopf */
.kopf{flex:none;display:flex;align-items:center;justify-content:space-between;padding:4px 16px 8px 18px}
.kopf small{display:block;font-size:13px;font-weight:500;color:var(--tinte2)}
.kopf h1{font-size:22px;font-weight:800;letter-spacing:.2px;line-height:1.15}
.einraeumen{display:flex;align-items:center;gap:7px;height:44px;padding:0 14px 0 10px;border-radius:14px;background:var(--petrol);color:#fbfaff;font:700 15px/1 "M PLUS Rounded 1c";border:0}
/* Am Lesen: Tablett */
.lesen{flex:none;margin:0 12px;padding:10px 10px 8px;border-radius:22px;background:var(--tablett);box-shadow:0 1px 0 rgba(45,36,64,.06),0 6px 18px -10px rgba(45,36,64,.35)}
.lesen h2{font-size:14px;font-weight:700;color:var(--tinte2);padding:0 6px 4px;display:flex;justify-content:space-between}
.lesen h2 span{font-weight:500}
.buch{display:flex;align-items:center;gap:10px;height:58px;padding:0 0 0 4px}
.buch + .buch{border-top:1.5px dashed #dcd7e8}
.buch svg{flex:none}
.buch .t{flex:1;min-width:0}
.buch .t b{display:block;font-size:15.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.buch .t i{display:block;font-style:normal;font-size:13px;font-weight:500;color:var(--tinte2)}
.zeichen{flex:none;position:relative;height:44px;min-width:84px;padding:0 12px 0 14px;display:flex;align-items:center;gap:6px;background:var(--senf);color:var(--tinte);border:0;font:800 15px/1 "M PLUS Rounded 1c";clip-path:polygon(0 0,100% 0,100% 100%,0 100%,9px 50%);border-radius:0 12px 12px 0}
.zeichen small{font-weight:700;font-size:12px}
.vier-only{display:none}
body.vier .vier-only{display:flex}
body.vier .buch{height:50px}
body.vier .lesen{padding-top:8px;padding-bottom:4px}
.n4{display:none} body.vier .n4{display:inline} body.vier .n2{display:none}
/* Zimmer */
.zimmer{position:relative;flex:1;margin:10px 12px 8px;border-radius:24px;overflow:hidden;background:var(--wand)}
.zimmer svg.raum{position:absolute;left:0;bottom:0;width:366px;height:440px}
.schild{position:absolute;display:flex;flex-direction:column;justify-content:center;min-height:44px;padding:4px 11px;border-radius:12px;background:var(--tinte);color:#fbf7ec;font-size:14.5px;font-weight:700;line-height:1.2;box-shadow:0 4px 10px -6px rgba(45,36,64,.7)}
.schild em{font-style:normal;font-size:12.5px;font-weight:500;color:#f3d27e}
.schild:after{content:"";position:absolute;width:10px;height:10px;background:var(--tinte);transform:rotate(45deg)}
.s-unten:after{bottom:-4px;left:20px}
.s-oben:after{top:-4px;left:20px}
.beispiel{position:absolute;right:10px;top:10px;font-size:11.5px;font-weight:700;color:var(--tinte2);background:rgba(246,244,251,.85);padding:3px 8px;border-radius:8px}
/* Tab-Leiste */
.tabs{flex:none;height:56px;display:flex;justify-content:space-around;align-items:flex-start;padding-top:4px;border-top:1px solid #dad6e7;background:var(--grund)}
.tab{width:84px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11.5px;font-weight:700;color:#6b6283}
.tab.an{color:var(--petrol)}
.home{flex:none;height:34px;display:flex;justify-content:center;align-items:flex-end;padding-bottom:8px}
.home i{width:134px;height:5px;border-radius:3px;background:var(--tinte)}
</style>
</head>
<body class="zwei">
