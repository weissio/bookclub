<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Meine Bibliothek – Aquarell</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Alegreya:ital,wght@0,400;0,500;1,400;1,500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#FBFAF7}
a{color:#23302A}a:hover{color:#4B6655}
button{font-family:Alegreya,serif;color:#23302A}
button:focus-visible{outline:3px solid #7FA38A;outline-offset:2px}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #FBFAF7; color: #23302A; font-family: Alegreya, serif; display: flex; flex-direction: column; overflow: hidden; position: relative">
<svg width="0" height="0" style="position: absolute" aria-hidden="true">
<defs>
<filter id="wcA" x="-20%" y="-20%" width="140%" height="140%"><feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="3" seed="3" result="t"></feTurbulence><feDisplacementMap in="SourceGraphic" in2="t" scale="11" xChannelSelector="R" yChannelSelector="G" result="d"></feDisplacementMap><feGaussianBlur in="d" stdDeviation="0.9"></feGaussianBlur></filter>
<filter id="wcB" x="-20%" y="-20%" width="140%" height="140%"><feTurbulence type="fractalNoise" baseFrequency="0.05" numOctaves="2" seed="11" result="t"></feTurbulence><feDisplacementMap in="SourceGraphic" in2="t" scale="6" xChannelSelector="R" yChannelSelector="G" result="d"></feDisplacementMap><feGaussianBlur in="d" stdDeviation="0.5"></feGaussianBlur></filter>
<filter id="grainA"><feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="2" seed="5"></feTurbulence><feColorMatrix values="0 0 0 0 0.55  0 0 0 0 0.5  0 0 0 0 0.42  0 0 0 0.09 0"></feColorMatrix></filter>
</defs>
</svg>

<svg width="390" height="270" viewBox="0 0 390 270" aria-hidden="true" style="display: block; flex-shrink: 0">
<g style="mix-blend-mode: multiply">
<rect x="-10" y="-10" width="410" height="250" fill="#F1E3C2" opacity="0.55" filter="url(#wcA)"></rect>
<rect x="36" y="34" width="148" height="176" fill="#A9C6D6" opacity="0.8" filter="url(#wcA)"></rect>
<ellipse cx="90" cy="168" rx="70" ry="44" fill="#7FA38A" opacity="0.75" filter="url(#wcA)"></ellipse>
<ellipse cx="150" cy="150" rx="46" ry="56" fill="#5F8A6E" opacity="0.6" filter="url(#wcA)"></ellipse>
<ellipse cx="62" cy="96" rx="30" ry="22" fill="#FFFFFF" opacity="0.7" filter="url(#wcB)"></ellipse>
<circle cx="300" cy="96" r="70" fill="#E2B866" opacity="0.35" filter="url(#wcA)"></circle>
<circle cx="300" cy="96" r="34" fill="#E2B866" opacity="0.55" filter="url(#wcB)"></circle>
<path d="M286 70 L314 70 L326 98 L274 98 Z" fill="#B5704A" opacity="0.8" filter="url(#wcB)"></path>
<rect x="234" y="196" width="130" height="40" rx="10" fill="#C98F7A" opacity="0.6" filter="url(#wcA)"></rect>
<rect x="244" y="150" width="34" height="52" rx="6" fill="#7FA38A" opacity="0.7" filter="url(#wcB)"></rect>
<ellipse cx="261" cy="146" rx="26" ry="18" fill="#5F8A6E" opacity="0.6" filter="url(#wcB)"></ellipse>
</g>
<g fill="none" stroke="#23302A" stroke-width="1.3" stroke-linecap="round" opacity="0.85">
<path d="M34 33 C80 31 140 35 186 32 L185 212 C130 210 80 213 35 211 Z"></path>
<path d="M110 33 C109 90 112 150 110 211"></path>
<path d="M35 120 C80 118 140 122 185 119"></path>
<path d="M300 0 C300 20 301 46 300 70"></path>
<path d="M20 222 C120 219 260 224 380 220"></path>
</g>
<rect width="390" height="270" filter="url(#grainA)"></rect>
</svg>

<div style="flex-grow: 1; overflow-y: auto; padding: 0 22px 16px 22px; display: flex; flex-direction: column; gap: 4px; margin-top: -26px; position: relative">
<div style="display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; margin-bottom: 8px">
<h1 style="margin: 0; font-size: 34px; font-weight: 500; line-height: 1.05">Meine Bibliothek</h1>
<button type="button" style="position: relative; min-height: 48px; padding: 0 14px; border: none; background: none; cursor: pointer; font-size: 16px; font-style: italic">
<svg width="132" height="46" viewBox="0 0 132 46" aria-hidden="true" style="position: absolute; left: 0; top: 1px; z-index: 0; mix-blend-mode: multiply"><ellipse cx="66" cy="23" rx="62" ry="19" fill="#E2B866" opacity="0.6" filter="url(#wcB)"></ellipse></svg>
<span style="position: relative">Neues Buch erfassen</span>
</button>
</div>

<button type="button" style="display: flex; align-items: center; gap: 16px; min-height: 96px; border: none; background: none; padding: 6px 0; cursor: pointer; text-align: left">
<svg width="72" height="88" viewBox="0 0 72 88" aria-hidden="true" style="flex-shrink: 0; mix-blend-mode: multiply"><rect x="10" y="6" width="54" height="78" rx="3" fill="#7FA38A" opacity="0.85" filter="url(#wcB)" transform="rotate(-6 37 45)"></rect><path d="M44 2 L44 30 L49 25 L54 30 L54 2" fill="#C2564A" opacity="0.85" filter="url(#wcB)"></path></svg>
<span style="display: flex; flex-direction: column; gap: 2px">
<span style="font-size: 15px; font-style: italic; color: #4B6655">Am Lesen</span>
<span style="font-size: 21px; font-weight: 500">Der stille Garten</span>
<span style="font-size: 15px">Mara Lind, bei Seite 142</span>
</span>
</button>

<sc-for list="{{shelves}}" as="s" hint-placeholder-count="4">
<button type="button" style="display: flex; flex-direction: column; gap: 0; border: none; background: none; padding: 10px 0 0 0; cursor: pointer; text-align: left">
<span style="font-size: 20px; font-weight: 500">{{s.name}}</span>
<span style="font-size: 14px; font-style: italic; color: #4B6655">{{s.hint}}</span>
<svg width="346" height="58" viewBox="0 0 346 58" aria-hidden="true" style="display: block; margin-top: 2px; mix-blend-mode: multiply">
<sc-for list="{{s.spines}}" as="b" hint-placeholder-count="8">
<rect x="{{b.x}}" y="{{b.y}}" width="{{b.w}}" height="{{b.h}}" rx="2" fill="{{b.c}}" opacity="0.8" filter="url(#wcB)"></rect>
</sc-for>
<rect x="0" y="50" width="346" height="7" fill="#B48A5C" opacity="0.65" filter="url(#wcB)"></rect>
</svg>
</button>
</sc-for>

<div style="display: flex; gap: 22px; padding-top: 14px">
<button type="button" style="min-height: 44px; border: none; background: none; padding: 0; cursor: pointer; font-size: 17px; text-decoration: underline; text-decoration-color: #7FA38A; text-underline-offset: 5px">Abgebrochen</button>
<button type="button" style="min-height: 44px; border: none; background: none; padding: 0; cursor: pointer; font-size: 17px; text-decoration: underline; text-decoration-color: #7FA38A; text-underline-offset: 5px">Eigene Regale</button>
</div>
</div>

<nav aria-label="Hauptbereiche" style="display: flex; justify-content: space-around; padding: 6px 12px 14px 12px; border-top: 1px solid #E6E1D4; background: #FBFAF7">
<a href="#" aria-current="page" style="min-height: 44px; display: flex; flex-direction: column; align-items: center; justify-content: center; text-decoration: none; font-size: 16px; font-weight: 500; color: #23302A; position: relative">Bibliothek<svg width="70" height="8" viewBox="0 0 70 8" aria-hidden="true" style="mix-blend-mode: multiply"><path d="M2 5 C20 2 50 7 68 3" stroke="#7FA38A" stroke-width="4" fill="none" stroke-linecap="round" filter="url(#wcB)"></path></svg></a>
<a href="#" style="min-height: 44px; display: flex; align-items: center; text-decoration: none; font-size: 16px; color: #4B6655">Schaufenster</a>
<a href="#" style="min-height: 44px; display: flex; align-items: center; text-decoration: none; font-size: 16px; color: #4B6655">Entdecken</a>
<a href="#" style="min-height: 44px; display: flex; align-items: center; text-decoration: none; font-size: 16px; color: #4B6655">Ich</a>
</nav>
<svg width="390" height="844" aria-hidden="true" style="position: absolute; inset: 0; pointer-events: none"><rect width="390" height="844" filter="url(#grainA)"></rect></svg>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
function row(colors, seed) {
  var x = 0, out = [], i = 0;
  while (x < 330) {
    var w = 14 + ((seed * (i + 3) * 7) % 13);
    var h = 30 + ((seed * (i + 5) * 11) % 18);
    out.push({ x: x, y: 50 - h, w: w, h: h, c: colors[i % colors.length] });
    x += w + 3; i++;
    if (i > 20) break;
  }
  return out;
}
class Component extends DCLogic {
  renderVals() {
    return {
      shelves: [
        { name: 'Gelesen', hint: 'mit deinen Karten und Gedanken', spines: row(['#7FA38A', '#A9C6D6', '#C98F7A', '#E2B866', '#5F8A6E'], 3) },
        { name: 'Ungelesen im Regal', hint: 'wartet geduldig', spines: row(['#C98F7A', '#E2B866', '#A9C6D6', '#9C8BB0'], 5).slice(0, 9) },
        { name: 'Wunschliste', hint: 'noch nicht bei dir', spines: row(['#D7E3E8', '#EBDDBE', '#E5CFC7'], 7).slice(0, 6) }
      ]
    };
  }
}
</script>
</body>
</html>
