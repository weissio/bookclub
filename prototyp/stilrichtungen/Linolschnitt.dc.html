<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Meine Bibliothek – Linolschnitt</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IM+Fell+English:ital@0;1&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#ECEAE3}
a{color:#1A1A1A}a:hover{color:#2C4A7A}
button{font-family:"IM Fell English",serif;color:#1A1A1A}
button:focus-visible,a:focus-visible{outline:3px solid #2C4A7A;outline-offset:2px}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #ECEAE3; color: #1A1A1A; font-family: 'IM Fell English', serif; display: flex; flex-direction: column; overflow: hidden">
<svg width="0" height="0" style="position: absolute" aria-hidden="true">
<defs>
<filter id="inkL"><feTurbulence type="fractalNoise" baseFrequency="0.6" numOctaves="2" seed="2" result="t"></feTurbulence><feDisplacementMap in="SourceGraphic" in2="t" scale="1.6"></feDisplacementMap></filter>
</defs>
</svg>

<div style="flex-grow: 1; overflow-y: auto; padding: 22px 22px 12px 22px; display: flex; flex-direction: column; gap: 18px">

<div style="display: flex; justify-content: center">
<svg width="300" height="214" viewBox="0 0 300 214" role="img" aria-label="Exlibris: zwischen den Zeilen" filter="url(#inkL)">
<rect x="6" y="6" width="288" height="202" fill="none" stroke="#1A1A1A" stroke-width="5"></rect>
<rect x="15" y="15" width="270" height="184" fill="none" stroke="#1A1A1A" stroke-width="1.5"></rect>
<path d="M190 34 a26 26 0 1 0 22 40 a20 20 0 1 1 -22 -40 z" fill="#2C4A7A"></path>
<g fill="#1A1A1A"><circle cx="70" cy="38" r="2.2"></circle><circle cx="98" cy="58" r="1.6"></circle><circle cx="236" cy="44" r="2"></circle><circle cx="124" cy="32" r="1.4"></circle></g>
<path d="M60 128 C90 110 130 112 150 124 C170 112 210 110 240 128 L240 152 C210 136 170 138 150 150 C130 138 90 136 60 152 Z" fill="#1A1A1A"></path>
<g fill="none" stroke="#ECEAE3" stroke-width="1.6" stroke-linecap="round"><path d="M72 128 C96 118 124 120 142 128"></path><path d="M72 136 C96 126 124 128 142 136"></path><path d="M158 128 C176 120 204 118 228 128"></path><path d="M158 136 C176 128 204 126 228 136"></path></g>
<g stroke="#1A1A1A" stroke-width="2" stroke-linecap="round"><path d="M150 106 L150 84"></path><path d="M130 110 L118 92"></path><path d="M170 110 L182 92"></path><path d="M114 118 L96 108"></path><path d="M186 118 L204 108"></path></g>
<text x="150" y="176" text-anchor="middle" font-family="IM Fell English, serif" font-size="24" fill="#1A1A1A">Ex Libris</text>
<text x="150" y="194" text-anchor="middle" font-family="IM Fell English, serif" font-style="italic" font-size="14" fill="#1A1A1A">zwischen den Zeilen</text>
</svg>
</div>

<div style="display: flex; align-items: baseline; justify-content: space-between">
<h1 style="margin: 0; font-size: 30px; font-weight: 400">Meine Bibliothek</h1>
<button type="button" style="min-height: 44px; padding: 0 14px; border: 2px solid #2C4A7A; border-radius: 2px; background: none; color: #2C4A7A; font-size: 16px; cursor: pointer">Neues Buch erfassen</button>
</div>

<div style="display: flex; flex-direction: column">
<sc-for list="{{rows}}" as="r" hint-placeholder-count="6">
<button type="button" style="display: flex; align-items: center; gap: 16px; min-height: 64px; border: none; background: none; padding: 4px 0; cursor: pointer; text-align: left; border-bottom: 1.5px solid #1A1A1A">
<svg width="40" height="40" viewBox="0 0 40 40" aria-hidden="true" filter="url(#inkL)" style="flex-shrink: 0">
<sc-if value="{{r.isReading}}" hint-placeholder-val="{{ false }}"><path d="M3 12 C10 8 17 9 20 12 C23 9 30 8 37 12 L37 32 C30 28 23 29 20 32 C17 29 10 28 3 32 Z" fill="#1A1A1A"></path><path d="M27 6 L27 20 L30 17 L33 20 L33 6 Z" fill="#2C4A7A"></path><path d="M7 18 C11 16 15 16 17 18 M7 23 C11 21 15 21 17 23 M23 18 C25 16 29 16 33 18" stroke="#ECEAE3" stroke-width="1.2" fill="none"></path></sc-if>
<sc-if value="{{r.isRead}}" hint-placeholder-val="{{ false }}"><rect x="5" y="26" width="30" height="8" fill="#1A1A1A"></rect><rect x="8" y="17" width="26" height="8" fill="#1A1A1A"></rect><rect x="4" y="8" width="28" height="8" fill="#1A1A1A"></rect><path d="M8 30 L30 30 M11 21 L30 21 M8 12 L28 12" stroke="#ECEAE3" stroke-width="1.2"></path></sc-if>
<sc-if value="{{r.isUnread}}" hint-placeholder-val="{{ false }}"><rect x="5" y="6" width="8" height="30" fill="#1A1A1A"></rect><rect x="15" y="10" width="7" height="26" fill="#1A1A1A"></rect><path d="M25 12 L32 10 L37 34 L30 36 Z" fill="#1A1A1A"></path><path d="M9 10 L9 32 M18 14 L18 32" stroke="#ECEAE3" stroke-width="1.2"></path></sc-if>
<sc-if value="{{r.isWish}}" hint-placeholder-val="{{ false }}"><path d="M33 4 C20 8 10 20 7 36 C14 26 24 18 33 4 Z" fill="#1A1A1A"></path><path d="M9 33 C15 23 22 15 31 7" stroke="#ECEAE3" stroke-width="1.2" fill="none"></path></sc-if>
<sc-if value="{{r.isDnf}}" hint-placeholder-val="{{ false }}"><rect x="8" y="5" width="24" height="30" fill="#1A1A1A"></rect><path d="M24 5 L24 22 L28 18 L32 22" fill="#ECEAE3"></path><path d="M12 12 L20 12 M12 18 L20 18" stroke="#ECEAE3" stroke-width="1.2"></path></sc-if>
<sc-if value="{{r.isShelf}}" hint-placeholder-val="{{ false }}"><rect x="3" y="32" width="34" height="4" fill="#1A1A1A"></rect><rect x="3" y="16" width="34" height="3" fill="#1A1A1A"></rect><rect x="6" y="4" width="5" height="12" fill="#1A1A1A"></rect><rect x="12" y="6" width="5" height="10" fill="#1A1A1A"></rect><rect x="22" y="21" width="5" height="11" fill="#1A1A1A"></rect><rect x="28" y="20" width="6" height="12" fill="#1A1A1A"></rect></sc-if>
</svg>
<span style="display: flex; flex-direction: column; gap: 1px">
<span style="font-size: 21px">{{r.name}}</span>
<span style="{{r.subStyle}}">{{r.sub}}</span>
</span>
</button>
</sc-for>
</div>
</div>

<nav aria-label="Hauptbereiche" style="display: flex; justify-content: space-around; padding: 6px 12px 14px 12px; border-top: 4px double #1A1A1A">
<a href="#" aria-current="page" style="min-height: 44px; display: flex; align-items: center; text-decoration: underline; text-decoration-color: #2C4A7A; text-decoration-thickness: 3px; text-underline-offset: 6px; font-size: 17px; color: #1A1A1A">Bibliothek</a>
<a href="#" style="min-height: 44px; display: flex; align-items: center; text-decoration: none; font-size: 17px; color: #1A1A1A">Schaufenster</a>
<a href="#" style="min-height: 44px; display: flex; align-items: center; text-decoration: none; font-size: 17px; color: #1A1A1A">Entdecken</a>
<a href="#" style="min-height: 44px; display: flex; align-items: center; text-decoration: none; font-size: 17px; color: #1A1A1A">Ich</a>
</nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
var SUB = 'font-size: 15px; font-style: italic; color: #3F3F3F';
var SUB_BLUE = 'font-size: 15px; font-style: italic; color: #2C4A7A';
class Component extends DCLogic {
  renderVals() {
    function r(name, sub, kind, blue) {
      return { name: name, sub: sub, subStyle: blue ? SUB_BLUE : SUB, isReading: kind === 'reading', isRead: kind === 'read', isUnread: kind === 'unread', isWish: kind === 'wish', isDnf: kind === 'dnf', isShelf: kind === 'shelf' };
    }
    return {
      rows: [
        r('Am Lesen', 'Der stille Garten, bei Seite 142', 'reading', true),
        r('Gelesen', 'mit deinen Karten und Gedanken', 'read'),
        r('Ungelesen im Regal', 'wartet geduldig', 'unread'),
        r('Wunschliste', 'noch nicht bei dir', 'wish'),
        r('Abgebrochen', 'vielleicht ein andermal', 'dnf'),
        r('Eigene Regale', 'deine Sammlungen', 'shelf')
      ]
    };
  }
}
</script>
</body>
</html>
